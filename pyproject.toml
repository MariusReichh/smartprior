[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartprior"
version = "0.1.0"
description = "SmartPrior: GPR-basierte Prior-Modelle für die schnelle Optimierung von Energieversorgungssystemen, validiert gegen einen regelbasierten Merit-Order-Dispatch-Simulator."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Marius" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",   # GaussianProcessRegressor
    "pyDOE2>=1.3",         # DoE-Sampling (LHS, Box-Behnken, ...)
    "pyyaml>=6.0",         # experiments/configs/*.yaml
    "matplotlib>=3.8",     # paper/figures
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
